<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="276" viewBox="0 0 1060 276" role="img" aria-labelledby="title description">
  <title id="title">Getting started with BoTube</title>
  <desc id="description">Install BoTube_Setup.exe from Releases, download AI resources in Settings, choose a model and content mode, then generate and review subtitles. AI resources require additional disk space.</desc>
  <rect width="1060" height="276" rx="20" fill="#0d1118"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="34" y="43" font-size="22" font-weight="700" fill="#edf3fa">Getting started with BoTube</text>
    <text x="34" y="69" font-size="14" fill="#9aaabc">Install the Windows app, then prepare AI resources separately in Settings</text>
    <g fill="#151c26" stroke="#273445">
      <rect x="34" y="94" width="222" height="100" rx="12"/>
      <rect x="290" y="94" width="222" height="100" rx="12"/>
      <rect x="546" y="94" width="222" height="100" rx="12"/>
      <rect x="802" y="94" width="222" height="100" rx="12"/>
    </g>
    <g font-size="13" font-weight="700" fill="#77e0be">
      <text x="51" y="118">01 · INSTALL THE APP</text>
      <text x="307" y="118">02 · GET AI RESOURCES</text>
      <text x="563" y="118">03 · CHOOSE SETTINGS</text>
      <text x="819" y="118">04 · CREATE SUBTITLES</text>
    </g>
    <g font-size="17" font-weight="600" fill="#edf3fa">
      <text x="51" y="147">BoTube_Setup.exe</text>
      <text x="307" y="147">Whisper + AI libraries</text>
      <text x="563" y="147">Lyrics / Dialogue</text>
      <text x="819" y="147">Create → review → save</text>
    </g>
    <g font-size="13" fill="#9aaabc">
      <text x="51" y="173">From GitHub Releases</text>
      <text x="307" y="173">Add NLLB for local translation</text>
      <text x="563" y="173">Model · CPU/CUDA · translation</text>
      <text x="819" y="173">Edit or export video + subtitles</text>
    </g>
    <g fill="none" stroke="#77e0be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M265 145h16m-5-5 5 5-5 5"/>
      <path d="M521 145h16m-5-5 5 5-5 5"/>
      <path d="M777 145h16m-5-5 5 5-5 5"/>
    </g>
    <rect x="34" y="214" width="990" height="35" rx="8" fill="#232017"/>
    <text x="49" y="237" font-size="14" fill="#f2ce82">Disk space: plan for 15–20 GB free for a large model + NLLB; downloads and exports need more.</text>
  </g>
</svg>
